<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TOKYO_DRIFT_88 - Title Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #131313;
            overflow: hidden;
        }
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
        .pixel-border {
            box-shadow: 4px 4px 0 0 #0e0e0e;
        }
        .pixel-text-shadow {
            text-shadow: 4px 4px 0px #0050ff;
        }
        .scanline-flicker {
            animation: flicker 0.15s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-press-start {
            animation: blink 0.8s steps(1) infinite;
        }
        .retro-gradient {
            background: linear-gradient(to bottom, #131313 0%, #380037 40%, #be05ba 70%, #ffabf1 100%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "secondary-fixed-dim": "#ffabf1",
                "surface-container-high": "#2a2a2a",
                "secondary-container": "#be05ba",
                "on-tertiary": "#003737",
                "tertiary-fixed": "#8ef3f2",
                "surface-bright": "#393939",
                "surface-container-lowest": "#0e0e0e",
                "on-secondary-container": "#ffe5f6",
                "on-error": "#690005",
                "on-secondary": "#5c0059",
                "background": "#131313",
                "surface-container-low": "#1b1b1b",
                "on-primary-container": "#dde1ff",
                "surface-container": "#1f1f1f",
                "inverse-primary": "#004bf0",
                "primary": "#b7c4ff",
                "tertiary": "#71d6d6",
                "on-primary": "#002584",
                "primary-fixed": "#dde1ff",
                "primary-container": "#0050ff",
                "outline-variant": "#434656",
                "surface-tint": "#b7c4ff",
                "on-primary-fixed-variant": "#0037b8",
                "on-secondary-fixed-variant": "#82007f",
                "error-container": "#93000a",
                "on-surface-variant": "#c3c5d9",
                "surface-variant": "#353535",
                "on-secondary-fixed": "#380037",
                "on-surface": "#e2e2e2",
                "on-tertiary-container": "#8ff4f3",
                "tertiary-container": "#007171",
                "on-tertiary-fixed": "#002020",
                "primary-fixed-dim": "#b7c4ff",
                "inverse-on-surface": "#303030",
                "outline": "#8d90a2",
                "secondary": "#ffabf1",
                "on-error-container": "#ffdad6",
                "surface-dim": "#131313",
                "error": "#ffb4ab",
                "surface": "#131313",
                "on-primary-fixed": "#001453",
                "inverse-surface": "#e2e2e2",
                "surface-container-highest": "#353535",
                "tertiary-fixed-dim": "#71d6d6",
                "secondary-fixed": "#ffd7f4",
                "on-tertiary-fixed-variant": "#004f4f",
                "on-background": "#e2e2e2"
              },
              fontFamily: {
                "headline": ["Space Grotesk"],
                "body": ["Space Grotesk"],
                "label": ["Space Grotesk"]
              },
              borderRadius: {"DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px"},
            },
          },
        }
    </script>
</head>
<body class="dark bg-background text-on-background selection:bg-secondary selection:text-on-secondary">
<div class="crt-overlay"></div>
<!-- Main Canvas -->
<main class="relative min-h-screen flex flex-col items-center justify-between py-16 px-6 overflow-hidden">
<!-- Retro Future Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<!-- Synthwave Sun -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full retro-gradient opacity-40 blur-sm"></div>
<!-- Horizon Line -->
<div class="absolute top-[60%] w-full h-[4px] bg-secondary-container shadow-[0_0_20px_#be05ba]"></div>
<!-- Grid Perspective -->
<div class="absolute top-[60%] left-0 w-full h-full opacity-20" style="background-image: linear-gradient(#be05ba 1px, transparent 1px), linear-gradient(90deg, #be05ba 1px, transparent 1px); background-size: 60px 60px; transform: perspective(300px) rotateX(60deg); transform-origin: top;"></div>
</div>
<!-- Title Section -->
<header class="relative z-10 text-center space-y-4">
<p class="text-tertiary font-label tracking-[0.4em] uppercase text-sm mb-2 opacity-80">Cyber-Narrative Engine</p>
<h1 class="text-6xl md:text-9xl font-black italic tracking-tighter text-primary pixel-text-shadow leading-none">
                TOKYO<br/>DRIFT_88
            </h1>
<div class="flex justify-center items-center gap-4 mt-8">
<div class="h-1 w-24 bg-secondary-container"></div>
<span class="text-secondary font-bold text-xl uppercase tracking-widest">A New Era</span>
<div class="h-1 w-24 bg-secondary-container"></div>
</div>
</header>
<!-- Options Menu -->
<div class="relative z-10 w-full max-w-md space-y-4">
<!-- New Game -->
<button class="w-full group relative flex items-center justify-between bg-surface-container-lowest border-4 border-primary-container px-8 py-5 transition-none hover:bg-primary-container hover:text-white active:translate-y-1">
<span class="text-2xl font-black uppercase tracking-widest group-hover:text-on-primary">New Game</span>
<span class="material-symbols-outlined text-3xl group-hover:text-on-primary" data-icon="play_arrow">play_arrow</span>
<!-- Block Shadow -->
<div class="absolute top-1 left-1 -z-10 w-full h-full bg-surface-container-highest"></div>
</button>
<!-- Continue -->
<button class="w-full group relative flex items-center justify-between bg-surface-container-lowest border-4 border-outline px-8 py-5 transition-none hover:bg-secondary-container hover:border-secondary-container hover:text-white active:translate-y-1">
<span class="text-2xl font-black uppercase tracking-widest text-outline group-hover:text-on-secondary">Continue</span>
<span class="material-symbols-outlined text-3xl text-outline group-hover:text-on-secondary" data-icon="save">save</span>
<!-- Block Shadow -->
<div class="absolute top-1 left-1 -z-10 w-full h-full bg-surface-container-highest"></div>
</button>
<!-- Options -->
<button class="w-full group relative flex items-center justify-between bg-surface-container-lowest border-4 border-outline px-8 py-5 transition-none hover:bg-tertiary-container hover:border-tertiary-container hover:text-white active:translate-y-1">
<span class="text-2xl font-black uppercase tracking-widest text-outline group-hover:text-on-tertiary">Options</span>
<span class="material-symbols-outlined text-3xl text-outline group-hover:text-on-tertiary" data-icon="settings">settings</span>
<!-- Block Shadow -->
<div class="absolute top-1 left-1 -z-10 w-full h-full bg-surface-container-highest"></div>
</button>
</div>
<!-- Footer / Start Prompt -->
<footer class="relative z-10 text-center space-y-8">
<div class="animate-press-start">
<p class="text-secondary-fixed-dim font-bold text-2xl uppercase tracking-[0.5em] pixel-text-shadow">Press Start Button</p>
</div>
<div class="flex flex-col items-center gap-2 opacity-50">
<p class="text-[0.65rem] font-label tracking-widest uppercase text-on-surface-variant">© 1988 NEON_CORP INTERNATIONAL</p>
<p class="text-[0.65rem] font-label tracking-widest uppercase text-on-surface-variant">Licensed by 8-BIT ENTERTAINMENT SYSTEM</p>
</div>
</footer>
<!-- Decorative Corner Blocks -->
<div class="absolute top-8 left-8 w-12 h-12 border-t-8 border-l-8 border-primary z-20"></div>
<div class="absolute top-8 right-8 w-12 h-12 border-t-8 border-r-8 border-primary z-20"></div>
<div class="absolute bottom-8 left-8 w-12 h-12 border-b-8 border-l-8 border-secondary-container z-20"></div>
<div class="absolute bottom-8 right-8 w-12 h-12 border-b-8 border-r-8 border-secondary-container z-20"></div>
</main>
<!-- Side Decoration: System Status -->
<aside class="hidden xl:flex fixed left-10 top-1/2 -translate-y-1/2 flex-col gap-6 z-30">
<div class="p-2 bg-surface-container-lowest border-l-4 border-tertiary">
<p class="text-[0.6rem] font-label text-tertiary">CPU_LOAD</p>
<div class="w-16 h-1 bg-tertiary-container mt-1"></div>
</div>
<div class="p-2 bg-surface-container-lowest border-l-4 border-secondary">
<p class="text-[0.6rem] font-label text-secondary">RAM_USED</p>
<div class="w-24 h-1 bg-secondary-container mt-1"></div>
</div>
<div class="p-2 bg-surface-container-lowest border-l-4 border-primary">
<p class="text-[0.6rem] font-label text-primary">VRAM_BUF</p>
<div class="w-12 h-1 bg-primary-container mt-1"></div>
</div>
</aside>
<!-- UI Anchor Component: Bottom Status (Simulated from JSON BottomNavBar) -->
<div class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-[#0e0e0e] border-t-4 border-[#be05ba] shadow-[0_-4px_0_0_#000000]">
<div class="flex flex-col items-center justify-center text-[#434656] p-2 hover:bg-[#353535] transition-none cursor-not-allowed">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
<span class="font-['Space_Grotesk'] font-bold text-xs uppercase mt-1">Drive</span>
</div>
<div class="flex flex-col items-center justify-center text-[#434656] p-2 hover:bg-[#353535] transition-none cursor-not-allowed">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-['Space_Grotesk'] font-bold text-xs uppercase mt-1">Map</span>
</div>
<div class="flex flex-col items-center justify-center text-[#434656] p-2 hover:bg-[#353535] transition-none cursor-not-allowed">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
<span class="font-['Space_Grotesk'] font-bold text-xs uppercase mt-1">Garage</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#be05ba] text-white p-2 scale-105">
<span class="material-symbols-outlined" data-icon="monitoring">monitoring</span>
<span class="font-['Space_Grotesk'] font-bold text-xs uppercase mt-1">Status</span>
</div>
</div>
</body></html>
